name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Checkout OpenFod-Docs
        uses: actions/checkout@v4
        with:
          repository: openfod/OpenFod-Docs
          ref: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
          path: OpenFod-Docs

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci
      - run: npm run build

      - name: Build documentation
        working-directory: OpenFod-Docs
        run: |
          python -m pip install -r requirements.txt
          make html

      - name: Bundle docs into dist
        run: |
          mkdir -p dist/docs
          cp -a OpenFod-Docs/build/html/. dist/docs/

      - uses: actions/upload-artifact@v4
        with:
          name: website-with-docs
          path: dist
