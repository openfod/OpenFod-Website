name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [docs-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Checkout OpenFod-Docs
        uses: actions/checkout@v4
        with:
          repository: openfod/OpenFod-Docs
          ref: main
          path: OpenFod-Docs
          token: ${{ secrets.DOCS_CHECKOUT_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci
      - run: npm run build

      - name: Build documentation
        working-directory: OpenFod-Docs
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_APIKEY: ${{ secrets.LLM_APIKEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          python -m pip install -r requirements.txt
          make html

      - name: Bundle docs into dist
        run: |
          mkdir -p dist/docs
          cp -a OpenFod-Docs/build/html/. dist/docs/

      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
